name: GameStream
options:
  bundleIdPrefix: com.gamestream
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      - path: GameStream/GameStreamApp.swift
      - path: GameStream/Fresh
      - path: GameStream/Services/SessionStore.swift
      - path: GameStream/Services/MicrosoftAuth.swift
      - path: GameStream/Services/BetterXCloudInjector.swift
      - path: GameStream/Services/ControllerRumble.swift
      - path: GameStream/Services/HapticManager.swift
      - path: GameStream/Services/SoundManager.swift
      - path: GameStream/Services/EmbeddedSounds.swift
      - path: GameStream/Views/SignInWebView.swift
      - path: GameStream/Views/StreamPlayerView.swift
    resources:
      - path: GameStream/Assets.xcassets
      - path: GameStream/Resources
        includes:
          - "**/*"
        excludes:
          - "**/.gitkeep"
          - "**/*.md"
          - "Sounds/**"
          - "**/*.wav"
          - "**/*.wav.b64"
          - "**/embedded.json"
    info:
      path: GameStream/Info.plist
      properties:
        CFBundleDisplayName: GameStream
        CFBundleName: GameStream
        CFBundleShortVersionString: "1.5.8"
        CFBundleVersion: "46"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Not used."
        NSMicrophoneUsageDescription: "Used for in-session voice chat."
        NSLocalNetworkUsageDescription: "Used to discover and connect to streaming sessions."
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamestream.app
        PRODUCT_NAME: GameStream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
