name: GameStream
options:
  bundleIdPrefix: com.gamestream
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

# No SPM packages — pure WebView client (faster CI resolve/archive)

targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      - path: GameStream
    resources:
      - path: GameStream/Assets.xcassets
    info:
      path: GameStream/Info.plist
      properties:
        CFBundleDisplayName: GameStream
        CFBundleName: GameStream
        CFBundleShortVersionString: "1.3.4"
        CFBundleVersion: "28"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Not used."
        NSMicrophoneUsageDescription: "Used for in-session voice chat."
        NSLocalNetworkUsageDescription: "Used to discover and connect to streaming sessions."
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamestream.app
        PRODUCT_NAME: GameStream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
