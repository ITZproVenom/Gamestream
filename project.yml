name: GameStream
options:
  bundleIdPrefix: com.gamestream
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      # The whole folder, deliberately. 1.x listed files one by one, which let
      # forty source files drift out of the build while still living in the
      # repository, so fixes were made to code the app never compiled.
      - path: GameStream
    info:
      path: GameStream/Info.plist
      properties:
        CFBundleDisplayName: GameStream
        CFBundleName: GameStream
        # The base version. CI adds the number of commits since this line last
        # changed, so bumping it here restarts the patch count.
        CFBundleShortVersionString: "2.1.1"
        CFBundleVersion: "1"
        # Stamped by CI. "dev" means a locally generated project.
        GSCommit: "dev"
        GSChannel: "beta"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIRequiredDeviceCapabilities:
          - arm64
        NSMicrophoneUsageDescription: "Used for in-game voice chat and for recording your voice over clips."
        NSLocalNetworkUsageDescription: "Used to reach Xbox Cloud Gaming servers on your network."
        NSPhotoLibraryAddUsageDescription: "Used to save screenshots and clips of your stream."
        CFBundleURLTypes:
          - CFBundleURLName: com.gamestream.app
            CFBundleURLSchemes:
              - gamestream
        # Shortcuts and Spotlight both start games, so the app has to be
        # allowed to act on a request that arrives while it is not running.
        NSUserActivityTypes:
          - PlayGameIntent
          - OpenLibraryIntent
          - ResumeLastGameIntent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamestream.app
        PRODUCT_NAME: GameStream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
