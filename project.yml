name: GameStream
options:
  bundleIdPrefix: com.gamestream
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

# No SPM packages — native hub + Better xCloud service layer

targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      - path: GameStream
        excludes:
          - "Resources/**"
          # Legacy UI (specification only — not compiled into the clean-slate app)
          - "Views/AnimatedBackground.swift"
          - "Views/EmptyStateView.swift"
          - "Views/GameDetailView.swift"
          - "Views/GameHubActivity.swift"
          - "Views/GameHubCards.swift"
          - "Views/GameHubLists.swift"
          - "Views/GameHubQueue.swift"
          - "Views/GameHubView.swift"
          - "Views/GlassCompat.swift"
          - "Views/HubLayout.swift"
          - "Views/IntroView.swift"
          - "Views/JumpBackInDock.swift"
          - "Views/LibraryView.swift"
          - "Views/LiquidGlassComponents.swift"
          - "Views/ListsBrowserView.swift"
          - "Views/RootView.swift"
          - "Views/SearchHubView.swift"
          - "Views/SearchPlaySupport.swift"
          - "Views/SearchView.swift"
          - "Views/SettingsView.swift"
          - "Views/WelcomeView.swift"
          # Locked core remains compiled:
          # Views/SignInWebView.swift, StreamPlayerView.swift, PlayLoadingView.swift
          # Views/OnboardingStore.swift (shared key store used by App onboarding)
    resources:
      - path: GameStream/Assets.xcassets
      - path: GameStream/Resources
        includes:
          - "**/*"
        excludes:
          - "**/.gitkeep"
          - "**/*.md"
          - "Sounds/**"
          - "**/*.wav"
          - "**/*.wav.b64"
          - "**/embedded.json"
    info:
      path: GameStream/Info.plist
      properties:
        CFBundleDisplayName: GameStream
        CFBundleName: GameStream
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "50"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Not used."
        NSMicrophoneUsageDescription: "Used for in-session voice chat."
        NSLocalNetworkUsageDescription: "Used to discover and connect to streaming sessions."
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamestream.app
        PRODUCT_NAME: GameStream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
