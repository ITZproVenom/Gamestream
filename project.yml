name: GameStream
options:
  bundleIdPrefix: com.gamestream
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

targets:
  GameStream:
    type: application
    platform: iOS
    sources:
      # The whole folder, deliberately. 1.x listed files one by one, which let
      # forty source files drift out of the build while still living in the
      # repository, so fixes were made to code the app never compiled.
      - path: GameStream
        excludes:
          - "Resources/**"
    resources:
      - path: GameStream/Resources
        includes:
          - "**/*"
        excludes:
          - "**/.gitkeep"
          - "**/*.md"
    info:
      path: GameStream/Info.plist
      properties:
        CFBundleDisplayName: GameStream
        CFBundleName: GameStream
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIRequiredDeviceCapabilities:
          - arm64
        NSMicrophoneUsageDescription: "Used for in-game voice chat."
        NSLocalNetworkUsageDescription: "Used to reach Xbox Cloud Gaming servers on your network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamestream.app
        PRODUCT_NAME: GameStream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
