<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GameStream</title>
<style>
  html,body{margin:0;height:100%;background:#07060f;color:#f5f5f7;font-family:-apple-system,system-ui,sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
  .card{max-width:360px}
  h1{font-size:22px;margin:0 0 10px}
  p{opacity:.7;line-height:1.45;margin:0 0 18px;font-size:15px}
  .badge{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:600}
</style></head>
<body><div class="wrap"><div class="card">
  <div class="badge">GameStream</div>
  <h1>Can't reach Xbox Cloud</h1>
  <p>Check your connection, then try Play again. GameStream will keep your session ready.</p>
</div></div></body></html>
