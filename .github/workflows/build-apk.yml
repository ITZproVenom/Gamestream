name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: App icon
        working-directory: .
        run: |
          set -euo pipefail
          python3 -m pip install --user 'pillow>=10' || python3 -m pip install --user --break-system-packages 'pillow>=10'
          python3 scripts/install_icons.py
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 - <<'PY'
          import struct, sys
          p = "GameStream/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          data = open(p, "rb").read()
          w, h = struct.unpack(">II", data[16:24])
          print(f"source icon {w}x{h} {len(data)} bytes")
          if (w, h) != (1024, 1024) or len(data) < 20000:
              sys.exit("invalid source icon")
          PY

      - name: Build debug APK
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --build-cache --parallel
          else
            gradle :app:assembleDebug --no-daemon --build-cache --parallel
          fi

      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/GameStream-debug.apk"
          python3 - "$GITHUB_WORKSPACE/GameStream-debug.apk" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          z = zipfile.ZipFile(path)
          names = [n for n in z.namelist() if "ic_launcher" in n]
          print("launcher entries:")
          for n in names:
              info = z.getinfo(n)
              print(f"  {n} {info.file_size} bytes")
          if not names:
              sys.exit("APK missing ic_launcher resources")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-debug-apk
          path: GameStream-debug.apk
          if-no-files-found: error

      - name: Build changelog + release identity
        id: meta
        working-directory: .
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          echo "tag=android-build-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=Android build #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          {
            echo "## Changelog"
            echo ""
            echo "**Platform:** Android · **Build:** \`${SHORT_SHA}\` · **${DATE_UTC}**"
            echo ""
            echo "### What's changed"
            echo ""
            git log --max-count=15 --pretty=format:'- %s (%h)' --no-merges -- android/ scripts/ || true
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo "Download **GameStream-debug.apk** (allow unknown sources)."
          } > android_release_notes.md

      - name: Publish new Android build release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body_path: android_release_notes.md
          files: GameStream-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GameStream-debug.apk
          body_path: android_release_notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
