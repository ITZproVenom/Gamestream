name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: App icon
        working-directory: .
        run: |
          set -euo pipefail
          python3 -m pip install --user 'pillow>=10' || python3 -m pip install --user --break-system-packages 'pillow>=10'
          python3 scripts/install_icons.py
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 - <<'PY'
          import struct, sys
          p = "GameStream/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          data = open(p, "rb").read()
          w, h = struct.unpack(">II", data[16:24])
          print(f"source icon {w}x{h} {len(data)} bytes")
          if (w, h) != (1024, 1024) or len(data) < 20000:
              sys.exit("invalid source icon")
          PY

      - name: Decode release keystore
        working-directory: .
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path("android/keystore/gamestream-release.jks.b64")
          dest = Path("android/keystore/gamestream-release.jks")
          dest.write_bytes(base64.b64decode(src.read_text()))
          print(f"wrote {dest} ({dest.stat().st_size} bytes)")
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --build-cache --parallel
          else
            gradle :app:assembleRelease --no-daemon --build-cache --parallel
          fi

      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/GameStream-release.apk"
          python3 - "$GITHUB_WORKSPACE/GameStream-release.apk" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          z = zipfile.ZipFile(path)
          names = z.namelist()
          print("entries:", len(names))
          for required in ("AndroidManifest.xml", "resources.arsc", "classes.dex"):
              if required not in names:
                  sys.exit(f"APK missing {required}")
          pngs = [n for n in names if n.endswith(".png") or n.endswith(".webp")]
          print("image entries:", len(pngs))
          for n in pngs[:20]:
              print(f"  {n} {z.getinfo(n).file_size} bytes")
          if not pngs:
              sys.exit("APK missing packaged image resources")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-release-apk
          path: GameStream-release.apk
          if-no-files-found: error

      - name: Build changelog + release identity
        id: meta
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          echo "tag=android-build-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=🤖 Android · GameStream #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

          python3 - "$SHORT_SHA" "$DATE_UTC" "$EVENT_NAME" <<'PY'
          import subprocess, sys
          from pathlib import Path

          short, date, event = sys.argv[1], sys.argv[2], sys.argv[3]

          prev = subprocess.check_output(
              ["git", "tag", "-l", "android-build-*", "--sort=-creatordate"],
              text=True,
          ).strip().splitlines()
          prev = prev[0] if prev else None

          range_arg = f"{prev}..HEAD" if prev else "HEAD"
          cmd = ["git", "log", range_arg, "--max-count=40", "--name-only",
                 "--pretty=format:COMMIT\t%h\t%s", "--no-merges"]
          raw = subprocess.check_output(cmd, text=True)

          def is_android_app_change(paths):
              for p in paths:
                  if p.startswith("android/app/"):
                      return True
                  if p.startswith("android/") and "build-apk.yml" not in p and ".github" not in p:
                      return True
              return False

          items = []
          sha = subject = None
          files = []
          for line in raw.splitlines():
              if line.startswith("COMMIT\t"):
                  if sha is not None and is_android_app_change(files):
                      items.append(f"- {subject} ({sha})")
                  _, sha, subject = line.split("\t", 2)
                  files = []
              elif line.strip():
                  files.append(line.strip())
          if sha is not None and is_android_app_change(files):
              items.append(f"- {subject} ({sha})")

          items = items[:20]
          should = event == "workflow_dispatch" or bool(items)
          Path("should_release.txt").write_text("true" if should else "false")

          if not items:
              items = ["- No new Android app code since the previous Android release (release skipped on push)."]

          since = f" since `{prev}`" if prev else ""
          body = "\n".join([
              "## 🤖 Android build",
              "",
              f"**Platform:** Android only · **Build:** `{short}` · **{date}**",
              f"**iOS builds:** use tag [`latest-ios`](https://github.com/ITZproVenom/Gamestream/releases/tag/latest-ios) — not this release.{since}",
              "",
              "### What's changed (Android)",
              "",
              *items,
              "",
              "---",
              "",
              "### Install",
              "Download **GameStream-release.apk** (allow unknown sources).",
              "Signed with the persistent GameStream release keystore.",
              "",
              "Always-current link: [`latest-android`](https://github.com/ITZproVenom/Gamestream/releases/tag/latest-android)",
              "",
          ])
          Path("android_release_notes.md").write_text(body)
          print(body)
          PY

          echo "should_release=$(cat should_release.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish new Android build release
        if: >-
          steps.meta.outputs.should_release == 'true' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          body_path: android_release_notes.md
          files: GameStream-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh latest-android pointer
        if: >-
          steps.meta.outputs.should_release == 'true' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          gh release delete latest-android --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-android \
            GameStream-release.apk \
            --title "🤖 Android · Latest APK" \
            --notes "$(cat android_release_notes.md)" \
            --prerelease

      - name: Publish versioned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GameStream-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
