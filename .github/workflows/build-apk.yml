name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Uses Gradle from the action (cached) — no need to bootstrap wrapper from scratch every run
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Build debug APK
        run: |
          set -euo pipefail
          # Prefer project wrapper if present; else use gradle from setup-gradle
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --build-cache --parallel
          else
            gradle :app:assembleDebug --no-daemon --build-cache --parallel
          fi

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/GameStream-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-debug-apk
          path: GameStream-debug.apk
          if-no-files-found: error

      - name: Build changelog + release identity
        id: meta
        working-directory: .
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          echo "tag=android-build-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=Android build #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          {
            echo "## Changelog"
            echo ""
            echo "**Platform:** Android · **Build:** \`${SHORT_SHA}\` · **${DATE_UTC}**"
            echo ""
            echo "### What's changed"
            echo ""
            git log --max-count=15 --pretty=format:'- %s (%h)' --no-merges -- android/ || true
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo "Download **GameStream-debug.apk** (allow unknown sources)."
          } > android_release_notes.md

      - name: Publish new Android build release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body_path: android_release_notes.md
          files: GameStream-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GameStream-debug.apk
          body_path: android_release_notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
