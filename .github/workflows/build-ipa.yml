name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project GameStream.xcodeproj \
            -scheme GameStream \
            -archivePath build/GameStream.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/GameStream.xcarchive/Products/Applications/GameStream.app build/Payload/
          cd build && zip -r GameStream-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-unsigned-ipa
          path: build/GameStream-unsigned.ipa
