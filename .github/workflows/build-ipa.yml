name: Build iOS Beta IPA

# Every build from this workflow publishes to the BETA channel only.
# The stable pointer (latest-ios) is never created, moved, or deleted here.
# 1.x decided the channel by grepping the commit subject for words like
# "beta" or "rumble", so an unrelated commit could publish itself as stable.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GameStream/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"
  # CI is the only compiler this project has, so a pull request has to prove
  # it builds before main moves. These runs stop after the archive: they
  # publish no release and never touch the beta pointer.
  pull_request:
    branches: [main]
    paths:
      - "GameStream/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

concurrency:
  group: ios-beta
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: App icon
        run: |
          set -euo pipefail
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet --upgrade pip
          .icon-venv/bin/pip install --quiet 'pillow>=10'
          .icon-venv/bin/python scripts/install_icons.py
          python3 - <<'PY'
          import struct, sys
          path = "GameStream/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          data = open(path, "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "app icon is not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          print(f"icon {width}x{height}, {len(data)} bytes")
          if (width, height) != (1024, 1024) or len(data) < 20000:
              sys.exit("invalid app icon - refusing to continue")
          PY

      - name: Stamp beta version
        id: version
        run: |
          set -euo pipefail
          # project.yml holds the base version. The patch number is how many
          # commits have landed since that base was last edited, so every
          # build carries a version that actually moved. Earlier builds
          # stamped only CFBundleVersion and left 2.0.0 sitting there, which
          # made ten rounds of fixes look like the same release.
          BASE="$(grep -m1 'CFBundleShortVersionString:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          MAJOR_MINOR="$(echo "$BASE" | cut -d. -f1,2)"
          BASE_PATCH="$(echo "$BASE" | cut -d. -f3)"
          BASE_PATCH="${BASE_PATCH:-0}"

          # -G, not -S: editing the version changes the line but not how many
          # times the key appears, so a pickaxe on the key name finds the
          # commit that introduced it years of commits ago and the patch
          # number comes out as 633.
          BASE_COMMIT="$(git log -1 --format=%H -G'CFBundleShortVersionString: "' -- project.yml || true)"
          if [ -n "$BASE_COMMIT" ]; then
            SINCE="$(git rev-list --count "${BASE_COMMIT}..HEAD")"
          else
            SINCE=0
          fi
          SHORT_VERSION="${MAJOR_MINOR}.$((BASE_PATCH + SINCE))"
          BUILD="${{ github.run_number }}"
          COMMIT="$(echo '${{ github.sha }}' | cut -c1-7)"

          python3 - "$SHORT_VERSION" "$BUILD" "$COMMIT" <<'PY'
          import re, sys
          from pathlib import Path
          version, build, commit = sys.argv[1], sys.argv[2], sys.argv[3]
          path = Path("project.yml")
          text = path.read_text()
          text = re.sub(r'CFBundleShortVersionString: "[^"]*"',
                        f'CFBundleShortVersionString: "{version}"', text, count=1)
          text = re.sub(r'CFBundleVersion: "[^"]*"',
                        f'CFBundleVersion: "{build}"', text, count=1)
          text = re.sub(r'GSCommit: "[^"]*"', f'GSCommit: "{commit}"', text, count=1)
          path.write_text(text)
          print(f"beta {version} build {build} ({commit})")
          PY
          echo "short=${SHORT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Confirm every source file is in the target
        run: |
          set -euo pipefail
          # The defining bug of 1.x was source files living in the repository
          # but not in the build. Fail loudly rather than ship that again.
          MISSING=0
          while IFS= read -r file; do
            name="$(basename "$file")"
            if ! grep -q "$name" GameStream.xcodeproj/project.pbxproj; then
              echo "NOT IN TARGET: $file" >&2
              MISSING=1
            fi
          done < <(find GameStream -name '*.swift')
          if [ "$MISSING" -ne 0 ]; then
            echo "Some Swift files are not compiled by the app target." >&2
            exit 1
          fi
          echo "All $(find GameStream -name '*.swift' | wc -l | tr -d ' ') Swift files are in the target."

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GameStream.xcodeproj \
            -scheme GameStream \
            -archivePath build/GameStream.xcarchive \
            -destination "generic/platform=iOS" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/GameStream.xcarchive/Products/Applications/GameStream.app"
          test -d "$APP" || { echo "archive produced no app" >&2; exit 1; }
          test -f "$APP/GameStream" || { echo "app has no binary" >&2; exit 1; }

          BIN_SIZE=$(stat -f%z "$APP/GameStream")
          if [ "$BIN_SIZE" -lt 200000 ]; then
            echo "binary is only ${BIN_SIZE} bytes - incomplete archive" >&2
            exit 1
          fi

          mkdir -p build/Payload
          rm -rf build/Payload/GameStream.app
          cp -R "$APP" build/Payload/
          (cd build && zip -qr GameStream-unsigned.ipa Payload)
          ls -lh build/GameStream-unsigned.ipa

          python3 - <<'PY'
          import plistlib, sys, zipfile
          archive = zipfile.ZipFile("build/GameStream-unsigned.ipa")
          names = archive.namelist()
          if not any(name.endswith("Assets.car") for name in names):
              sys.exit("IPA has no asset catalog - the app icon would be blank")
          plist = [n for n in names if n.endswith("GameStream.app/Info.plist")]
          if not plist:
              sys.exit("IPA has no Info.plist")
          info = plistlib.loads(archive.read(plist[0]))
          print("version", info.get("CFBundleShortVersionString"), "build", info.get("CFBundleVersion"))
          if not info.get("CFBundleShortVersionString", "").startswith("2."):
              sys.exit("unexpected version in the packaged app")
          PY

      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          echo "tag=ios-beta-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=iOS Beta ${{ steps.version.outputs.short }} (build ${{ steps.version.outputs.build }})" >> "$GITHUB_OUTPUT"

          python3 - "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}" "$SHORT_SHA" <<'PY'
          import subprocess, sys
          from pathlib import Path

          version, build, sha = sys.argv[1], sys.argv[2], sys.argv[3]

          # Compare against the previous BETA tag. 1.x always compared against
          # ios-build-* tags, so beta releases repeated the same changelog.
          tags = subprocess.run(
              ["git", "tag", "-l", "ios-beta-*", "--sort=-creatordate"],
              capture_output=True, text=True,
          ).stdout.split()
          previous = tags[0] if tags else None

          span = f"{previous}..HEAD" if previous else "-20"
          commits = subprocess.run(
              ["git", "log", span, "--no-merges", "--pretty=format:- %s (%h)"],
              capture_output=True, text=True,
          ).stdout.strip().splitlines()[:25]
          if not commits:
              commits = ["- No new commits since the previous beta."]

          body = "\n".join([
              f"## iOS Beta {version} (build {build})",
              "",
              "**This is a beta build.** It is published to the beta channel only and "
              "does not replace any stable release.",
              "",
              "### Changes",
              "",
              *commits,
              "",
              "---",
              "",
              "### Install",
              "Download **GameStream-unsigned.ipa** and sideload it with AltStore, "
              "Sideloadly, or TrollStore.",
              "",
              f"Always-current beta: [`latest-ios-beta`](https://github.com/{'${{ github.repository }}'}/releases/tag/latest-ios-beta)",
              "",
              "_Unsigned. Not affiliated with Microsoft._",
          ])
          Path("release_notes.md").write_text(body)
          print(body)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-beta-ipa
          path: build/GameStream-unsigned.ipa
          if-no-files-found: error

      - name: Publish beta release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release_notes.md
          files: build/GameStream-unsigned.ipa
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the latest-ios-beta pointer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest-ios-beta --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-ios-beta \
            build/GameStream-unsigned.ipa \
            --title "iOS Beta - latest" \
            --notes-file release_notes.md \
            --prerelease
