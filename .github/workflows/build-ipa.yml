name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "GameStream/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /usr/local/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}-v1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen already available"
          fi

      # Icon gen is optional; skip network-heavy pillow install when icons already exist
      - name: App icon (optional)
        run: |
          if [ ! -f GameStream/Assets.xcassets/AppIcon.appiconset/icon-1024.png ]; then
            pip3 install --quiet pillow && python3 scripts/generate_app_icons.py || true
          else
            echo "App icon already present — skip generate"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GameStream.xcodeproj \
            -scheme GameStream \
            -archivePath build/GameStream.xcarchive \
            -destination "generic/platform=iOS" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/GameStream.xcarchive/Products/Applications/GameStream.app build/Payload/
          cd build && zip -qr GameStream-unsigned.ipa Payload
          ls -lh GameStream-unsigned.ipa

      - name: Build changelog + release identity
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          echo "tag=ios-build-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=iOS build #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

          {
            echo "## Changelog"
            echo ""
            echo "**Platform:** iOS · **Build:** \`${SHORT_SHA}\` · **${DATE_UTC}**"
            echo ""
            echo "### What's changed"
            echo ""
            git log --max-count=15 --pretty=format:'- %s (%h)' --no-merges
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "### Install"
            echo "Download **GameStream-unsigned.ipa** (AltStore / Sideloadly / TrollStore)."
            echo ""
            echo "_Unsigned — not App Store signed._"
          } > release_notes.md

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameStream-unsigned-ipa
          path: build/GameStream-unsigned.ipa
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GameStream-unsigned.ipa
          body_path: release_notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish new iOS build release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body_path: release_notes.md
          files: build/GameStream-unsigned.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
